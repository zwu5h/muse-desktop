<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muse Desktop</title>
    <link rel="icon" type="image/svg+xml" href="muse-mark.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="brand">
          <img class="brand-logo" src="muse-mark.svg" alt="Muse Logo" />
          <div class="brand-text">
            <div class="brand-name">Muse Desktop</div>
            <div class="brand-sub" id="cli-status">CLI wird geprüft …</div>
          </div>
          <span id="status-dot" class="dot idle" title="Status"></span>
        </div>

        <button id="new-chat" class="btn primary">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
          Neuer Chat
        </button>

        <div class="field">
          <label for="workspace">Arbeitsordner</label>
          <div class="row">
            <input id="workspace" type="text" placeholder="z. B. C:\Dev\mein-projekt" />
            <button id="workspace-btn" class="btn icon" title="Ordner wählen">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M1.5 4.5c0-.8.7-1.5 1.5-1.5h3l1.2 1.5h5.3c.8 0 1.5.7 1.5 1.5v4.5c0 .8-.7 1.5-1.5 1.5H3c-.8 0-1.5-.7-1.5-1.5v-6z"/></svg>
            </button>
          </div>
        </div>

        <div class="field-row">
          <div class="field grow">
            <label for="model">Modell</label>
            <input id="model" type="text" placeholder="Standard" />
          </div>
        </div>

        <div class="field">
          <label>Denk-Tiefe</label>
          <div id="effort-pills" class="pills"></div>
        </div>

        <div class="sessions-head">
          <span>Sitzungen</span>
        </div>
        <div class="search-row">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <input id="session-search" type="text" placeholder="Suchen …" />
        </div>
        <ul id="sessions"></ul>

        <div class="sidebar-foot">
          <label for="cli-path">Muse-CLI Pfad <span class="opt">(optional)</span></label>
          <div class="row">
            <input id="cli-path" type="text" placeholder="Auto-Erkennung" />
            <button id="cli-reset" class="btn icon" title="Zurück auf Auto-Erkennung">Auto</button>
          </div>
        </div>
      </aside>

      <main id="main">
        <header id="topbar">
          <img class="topbar-logo" src="muse-mark.svg" alt="" />
          <div class="topbar-titles">
            <div id="chat-title">Neuer Chat</div>
            <div id="chat-sub">Bereit</div>
          </div>
          <span id="model-badge" class="badge ghost" title="Modell">Standard</span>
          <span id="effort-badge" class="badge" title="Reasoning-Effort">High</span>
          <span id="status-pill" class="status-pill ready"><span class="pulse"></span><span id="status-text">Bereit</span></span>
        </header>

        <div id="messages" aria-live="polite"></div>

        <div class="composer-wrap">
          <div id="attachments"></div>
          <div id="composer">
            <textarea
              id="prompt"
              rows="1"
              placeholder="Nachricht an Muse … (Bilder: Strg+V, Senden: Strg+Enter)"
            ></textarea>
            <div class="toolbar">
              <button id="attach-btn" class="btn ghost" title="Bilder anhängen (Vision)">
                <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><circle cx="5.5" cy="6.5" r="1.3"/><path d="M2.5 12l3.5-3.5 2.5 2.5 2-2 3 3"/></svg>
                Bild
              </button>
              <span id="composer-meta">Strg+Enter zum Senden</span>
              <button id="send-btn" class="send-btn" title="Senden (Strg+Enter)">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
